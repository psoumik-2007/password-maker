[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "password-maker"
version = "1.0.0"
description = "Generate cryptographically secure passwords from the command line"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
password-maker = "main:main"

[tool.setuptools]
py-modules = ["main"]
